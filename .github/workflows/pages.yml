name: Deploy GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Stage public site only
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/css _site/js
          test -f index.html
          test -d css
          test -d js
          cp index.html _site/
          cp -r css/. _site/css/
          cp -r js/. _site/js/
          mkdir -p _site/assets
          if [ -d assets ]; then cp -r assets/. _site/assets/; fi
          # Public allowlist only: index.html, css/**, js/**, assets/**.
          # Never stage prototype/, docs, shots, SPEC, Legal, STATE, or other paths.
          test -f _site/index.html
          test -f _site/css/tokens.css
          test -f _site/js/main.js
          if [ -e _site/prototype ] || [ -e _site/SPEC.md ] || [ -e _site/shots ]; then
            echo "Refuse: non-public path leaked into _site" >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
